name: Playwright Tests
# API tests against Toolshop sprint 5 in Docker on the runner by default, so CI does not depend on
# the shared public demo. Run the workflow by hand with target "live" for the demo instead; the live
# demo is shared and its credentials/data can change.
# Pull requests run an ephemeral Redline inside the job (DozerDB service + pinned server): database baru,
# contract source di-seed, quarantine dari file. Push main memakai Redline persistent di laptop lewat
# REDLINE_TAILNET_HOST untuk history/trend/impact; impact dan targeted run bersifat best-effort.
# A manual dispatch with `redline: ephemeral` forces the self-contained path on a branch or main.
# See docs/redline-tailscale.md. Laporan Allure dari main diterbitkan ke GitHub Pages.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Toolshop to test against
        type: choice
        options: [local, live]
        default: local
      scope:
        description: Tests to run
        type: choice
        options: [full, affected]
        default: full
      redline:
        description: Redline backend
        type: choice
        options: [persistent, ephemeral]
        default: persistent

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  TOOLSHOP_TARGET: ${{ inputs.target || 'local' }}
  # PRs can opt into affected-only runs with the repository variable REDLINE_PR_SCOPE=affected.
  # Push/main and manual runs default to full; manual runs can choose affected in the dispatch form.
  TEST_SCOPE: ${{ github.event_name == 'pull_request' && (vars.REDLINE_PR_SCOPE || 'full') || inputs.scope || 'full' }}
  # Toolshop dikunci ke commit yang sama dengan yang dipakai lokal, supaya hasilnya bisa diulang.
  TOOLSHOP_REF: 5a6ccc2668405c96de9e205beb441f34be8d9ecc
  SPRINT: sprint5
  DISABLE_LOGGING: "true"
  # Versi Redline yang dipakai di CI, dikunci supaya hasilnya bisa diulang. Harus sama dengan tag
  # paket redline-playwright di package.json; `npm run check:redline-ref` menjaga keduanya.
  REDLINE_REF: v1.9.0
  # Kosong = Redline ephemeral di dalam job. Isi dengan <machine>.<tailnet>.ts.net untuk mengirim
  # report ke Redline persisten di laptop lewat Tailscale (docs/redline-tailscale.md).
  REDLINE_TAILNET_HOST: ${{ vars.REDLINE_TAILNET_HOST }}
  # Test/gate backend: PR selalu ephemeral; main/manual memakai persistent kalau diminta dan host tersedia.
  REDLINE_MODE: ${{ (github.event_name != 'pull_request' && (inputs.redline || 'persistent') == 'persistent' && vars.REDLINE_TAILNET_HOST != '') && 'persistent' || 'ephemeral' }}
  # Impact dan targeted run bersifat advisory: boleh memakai Redline persistent walau test berjalan ephemeral.
  REDLINE_IMPACT: ${{ vars.REDLINE_TAILNET_HOST != '' }}
  PAGES_URL: https://ega-septian.github.io/playwright-web-api-automation

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.artifact_id }}
    services:
      neo4j:
        # Database Redline, sama dengan docker-compose.yml di repo Redline. Kosong di setiap run.
        # Tetap dinyalakan di mode external; biayanya kecil dan workflow tetap satu job.
        image: graphstack/dozerdb:5.26.27.0
        env:
          NEO4J_AUTH: neo4j/redline-local
          NEO4J_server_memory_heap_max__size: 1G
          NEO4J_server_memory_pagecache_size: 512M
        ports:
          - 7688:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p redline-local 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
    steps:
      - uses: actions/checkout@v4

      - name: Redline mode
        run: |
          if [ "$REDLINE_MODE" = "persistent" ]; then
            echo "Reporting to persistent Redline at https://$REDLINE_TAILNET_HOST"
          else
            echo "Starting a throwaway Redline in this job (ephemeral mode)"
          fi

      - name: Checkout Toolshop
        if: env.TOOLSHOP_TARGET == 'local'
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          ref: ${{ env.TOOLSHOP_REF }}
          path: toolshop

      - name: Make Laravel storage writable
        if: env.TOOLSHOP_TARGET == 'local'
        # Sprint 5 menyimpan cache di file (storage/framework/cache). PHP di container berjalan sebagai uid 1000,
        # folder hasil checkout milik user runner, jadi tanpa ini GET dan DELETE membalas 500.
        run: chmod -R a+rwX toolshop/$SPRINT/API/storage toolshop/$SPRINT/API/bootstrap/cache

      - name: Start Toolshop (API, web server, database)
        if: env.TOOLSHOP_TARGET == 'local'
        working-directory: toolshop
        # UI Angular tidak dijalankan: test di project ini hanya memanggil API.
        run: docker compose -f docker-compose.yml up -d --build laravel-api web mariadb

      - name: Install API dependencies
        if: env.TOOLSHOP_TARGET == 'local'
        working-directory: toolshop
        run: docker compose exec -T -u root laravel-api composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-ffi

      - name: Wait for the database
        if: env.TOOLSHOP_TARGET == 'local'
        working-directory: toolshop
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent && exit 0
            sleep 2
          done
          echo "MariaDB tidak siap dalam 60 detik"; exit 1

      - name: Create and seed the database
        if: env.TOOLSHOP_TARGET == 'local'
        working-directory: toolshop
        run: docker compose exec -T laravel-api php artisan migrate:refresh --seed

      - name: Wait for the API
        if: env.TOOLSHOP_TARGET == 'local'
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8091/status && exit 0
            sleep 2
          done
          echo "API tidak menjawab di http://localhost:8091/status"; exit 1

      - name: Checkout Redline
        if: env.REDLINE_MODE == 'ephemeral'
        uses: actions/checkout@v4
        with:
          repository: ega-septian/redline
          ref: ${{ env.REDLINE_REF }}
          path: redline

      - uses: actions/setup-go@v5
        if: env.REDLINE_MODE == 'ephemeral'
        with:
          go-version-file: redline/go.mod
          cache-dependency-path: redline/go.sum

      - name: Start Redline
        if: env.REDLINE_MODE == 'ephemeral'
        working-directory: redline
        # Tanpa ANTHROPIC_API_KEY: kegagalan dijelaskan dengan aturan saja (tanpa biaya). Database baru setiap
        # run, jadi belum ada riwayat "terakhir lulus" untuk dibandingkan.
        run: |
          go build -o redline-server ./cmd/server
          nohup ./redline-server > redline.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8787/healthz && exit 0
            sleep 1
          done
          echo "Redline tidak menjawab di http://localhost:8787/healthz"; cat redline.log; exit 1

      - name: Seed Redline contract source
        if: env.REDLINE_MODE == 'ephemeral'
        # Contract sources hanya dibaca dari database. Database CI kosong setiap run, jadi sumbernya diisi
        # lewat API setelah server hidup; URL memakai Toolshop yang berjalan di job yang sama.
        run: |
          curl -fsS -X PUT http://localhost:8787/api/config/contracts \
            -H "Content-Type: application/json" \
            -d '{"project":"toolshop","url":"http://localhost:8091/docs"}'

      - name: Connect to Tailscale
        # PR ephemeral: Tailscale hanya untuk impact lookup, jadi kegagalannya tidak boleh memblokir test.
        if: env.REDLINE_IMPACT == 'true' && (env.REDLINE_MODE == 'persistent' || github.event_name == 'pull_request')
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.REDLINE_TAILNET_HOST }}

      - name: Check external Redline
        if: env.REDLINE_IMPACT == 'true' && (env.REDLINE_MODE == 'persistent' || github.event_name == 'pull_request')
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          REDLINE_API_KEY: ${{ secrets.REDLINE_API_KEY }}
        run: |
          curl -sf --retry 10 --retry-delay 2 --retry-all-errors \
            "https://${{ env.REDLINE_TAILNET_HOST }}/readyz"
          # Fail before the suite if the key does not match; /readyz is open on purpose.
          curl -sf -H "Authorization: Bearer $REDLINE_API_KEY" \
            "https://${{ env.REDLINE_TAILNET_HOST }}/api/runs?limit=1" > /dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Redline impact
        # Advisory: map changed files to tests and update one PR comment. The full suite still runs.
        if: github.event_name == 'pull_request' && env.REDLINE_IMPACT == 'true'
        continue-on-error: true
        env:
          REDLINE_URL: https://${{ vars.REDLINE_TAILNET_HOST }}
          REDLINE_API_KEY: ${{ secrets.REDLINE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/redline-impact.mts --comment

      - name: Select affected tests
        id: affected
        # Opt-in only; no mapped tests or a failed lookup falls back to the full suite.
        if: env.TEST_SCOPE == 'affected' && env.REDLINE_IMPACT == 'true'
        continue-on-error: true
        env:
          REDLINE_URL: https://${{ vars.REDLINE_TAILNET_HOST }}
          REDLINE_API_KEY: ${{ secrets.REDLINE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GREP=$(node scripts/redline-impact.mts --grep)
          echo "grep=$GREP" >> "$GITHUB_OUTPUT"
          if [ -z "$GREP" ]; then
            echo "No mapped test; the full suite will run."
          else
            echo "Affected tests: $GREP"
          fi

      - name: Previous Allure history
        # Riwayat tren dari laporan terakhir di GitHub Pages. Run pertama belum punya riwayat.
        run: |
          mkdir -p test-results
          curl -sfL "$PAGES_URL/history.jsonl" -o test-results/allure-history.jsonl \
            || echo "Belum ada riwayat Allure di $PAGES_URL"

      - name: Run Playwright tests
        continue-on-error: true
        run: |
          if [ -n "$TEST_GREP" ]; then
            echo "Running affected tests: $TEST_GREP"
            npx playwright test --grep "$TEST_GREP"
          else
            npx playwright test
          fi
        env:
          TEST_GREP: ${{ steps.affected.outputs.grep }}
          # External mode: send to the Tailscale Serve URL; otherwise the throwaway server on localhost.
          REDLINE_URL: ${{ env.REDLINE_MODE == 'persistent' && format('https://{0}', vars.REDLINE_TAILNET_HOST) || 'http://localhost:8787' }}
          REDLINE_API_KEY: ${{ secrets.REDLINE_API_KEY }}
          # REDLINE_AI=1 meminta analisis; tanpa API key di server, yang dipakai hanya aturan.
          REDLINE_AI: "1"
          # Batasi jumlah insiden yang dianalisis AI per run; budget harian tetap di server.
          REDLINE_AI_MAX: "5"
          # Toolshop's seed admin, the same for everyone (live and Docker): not a secret. Customers are
          # registered by the tests.
          TOOLSHOP_ADMIN_EMAIL: admin@practicesoftwaretesting.com
          TOOLSHOP_ADMIN_PASSWORD: welcome01

      - name: Redline quality gate
        # Fail only on failed tests without an active quarantine. Quarantined tests still run.
        if: ${{ !cancelled() }}
        env:
          REDLINE_URL: ${{ env.REDLINE_MODE == 'persistent' && format('https://{0}', vars.REDLINE_TAILNET_HOST) || 'http://localhost:8787' }}
          REDLINE_API_KEY: ${{ secrets.REDLINE_API_KEY }}
        run: node scripts/redline-gate.mts

      - name: Build Allure report
        if: ${{ !cancelled() }}
        run: |
          npx allure generate
          # Riwayat ikut diterbitkan, supaya run berikutnya bisa melanjutkan trennya.
          cp test-results/allure-history.jsonl test-results/allure-report/history.jsonl

      - name: Toolshop logs (on failure)
        if: failure() && env.TOOLSHOP_TARGET == 'local'
        working-directory: toolshop
        run: docker compose logs --tail=200 laravel-api web mariadb

      - name: Redline logs (on failure)
        if: failure() && env.REDLINE_MODE == 'ephemeral'
        run: tail -100 redline/redline.log || true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: test-results/allure-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: redline-report
          path: |
            test-results/redline-report.md
            test-results/redline-last-run.json
            test-results/results.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload report for GitHub Pages
        # Hanya dari main. Laporan diterbitkan juga saat ada test gagal: justru saat itu laporannya dibutuhkan.
        id: pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: test-results/allure-report/

  deploy:
    needs: test
    # Juga saat test gagal, asalkan laporannya sempat dibuat.
    if: ${{ !cancelled() && needs.test.outputs.pages != '' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
