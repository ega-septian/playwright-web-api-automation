name: Playwright Tests
# API tests against the live Toolshop demo (api.practicesoftwaretesting.com) by default. Run the workflow
# by hand with target "local" to start Toolshop (Practice Software Testing) in Docker on the runner instead,
# like Toolshop's own workflow (.github/workflows/run-tests.yml in their repo).
# Redline normally runs inside the job (DozerDB service + pinned server). Set the repository variable
# REDLINE_TAILNET_HOST to report to a persistent Redline on your laptop over Tailscale instead; every
# run then keeps its history. See docs/redline-tailscale.md. Laporan Allure dari main diterbitkan ke
# GitHub Pages; riwayat trennya dibawa dari laporan sebelumnya.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Toolshop to test against
        type: choice
        options: [live, local]
        default: live

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  TOOLSHOP_TARGET: ${{ inputs.target || 'live' }}
  # Toolshop dikunci ke commit yang sama dengan yang dipakai lokal, supaya hasilnya bisa diulang.
  TOOLSHOP_REF: 5a6ccc2668405c96de9e205beb441f34be8d9ecc
  SPRINT: sprint5
  DISABLE_LOGGING: "true"
  # Versi Redline yang dipakai di CI, dikunci supaya hasilnya bisa diulang. Harus sama dengan tag
  # paket redline-playwright di package.json; `npm run check:redline-ref` menjaga keduanya.
  REDLINE_REF: v0.7.0
  # Kosong = Redline ephemeral di dalam job. Isi dengan <machine>.<tailnet>.ts.net untuk mengirim
  # report ke Redline persisten di laptop lewat Tailscale (docs/redline-tailscale.md).
  REDLINE_TAILNET_HOST: ${{ vars.REDLINE_TAILNET_HOST }}
  PAGES_URL: https://ega-septian.github.io/playwright-web-api-automation

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.artifact_id }}
    services:
      neo4j:
        # Database Redline, sama dengan docker-compose.yml di repo Redline. Kosong di setiap run.
        # Tetap dinyalakan di mode external; biayanya kecil dan workflow tetap satu job.
        image: graphstack/dozerdb:5.26.27.0
        env:
          NEO4J_AUTH: neo4j/redline-local
          NEO4J_server_memory_heap_max__size: 1G
          NEO4J_server_memory_pagecache_size: 512M
        ports:
          - 7688:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p redline-local 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
    steps:
      - uses: actions/checkout@v4

      - name: Redline mode
        run: |
          if [ -n "$REDLINE_TAILNET_HOST" ]; then
            echo "Reporting to persistent Redline at https://$REDLINE_TAILNET_HOST"
          else
            echo "Starting a throwaway Redline in this job"
          fi

      - name: Checkout Toolshop
        if: env.TOOLSHOP_TARGET == 'local'
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          ref: ${{ env.TOOLSHOP_REF }}
          path: toolshop

      - name: Make Laravel storage writable
        if: env.TOOLSHOP_TARGET == 'local'
        # Sprint 5 menyimpan cache di file (storage/framework/cache). PHP di container berjalan sebagai uid 1000,
        # folder hasil checkout milik user runner, jadi tanpa ini GET dan DELETE membalas 500.
        run: chmod -R a+rwX toolshop/$SPRINT/API/storage toolshop/$SPRINT/API/bootstrap/cache

      - name: Start Toolshop (API, web server, database)
        if: env.TOOLSHOP_TARGET == 'local'
        working-directory: toolshop
        # UI Angular tidak dijalankan: test di project ini hanya memanggil API.
        run: docker compose -f docker-compose.yml up -d --build laravel-api web mariadb

      - name: Install API dependencies
        if: env.TOOLSHOP_TARGET == 'local'
        working-directory: toolshop
        run: docker compose exec -T -u root laravel-api composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-ffi

      - name: Wait for the database
        if: env.TOOLSHOP_TARGET == 'local'
        working-directory: toolshop
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent && exit 0
            sleep 2
          done
          echo "MariaDB tidak siap dalam 60 detik"; exit 1

      - name: Create and seed the database
        if: env.TOOLSHOP_TARGET == 'local'
        working-directory: toolshop
        run: docker compose exec -T laravel-api php artisan migrate:refresh --seed

      - name: Wait for the API
        if: env.TOOLSHOP_TARGET == 'local'
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8091/status && exit 0
            sleep 2
          done
          echo "API tidak menjawab di http://localhost:8091/status"; exit 1

      - name: Checkout Redline
        if: env.REDLINE_TAILNET_HOST == ''
        uses: actions/checkout@v4
        with:
          repository: ega-septian/redline
          ref: ${{ env.REDLINE_REF }}
          path: redline

      - uses: actions/setup-go@v5
        if: env.REDLINE_TAILNET_HOST == ''
        with:
          go-version-file: redline/go.mod
          cache-dependency-path: redline/go.sum

      - name: Start Redline
        if: env.REDLINE_TAILNET_HOST == ''
        working-directory: redline
        # Tanpa ANTHROPIC_API_KEY: kegagalan dijelaskan dengan aturan saja (tanpa biaya). Database baru setiap
        # run, jadi belum ada riwayat "terakhir lulus" untuk dibandingkan.
        run: |
          go build -o redline-server ./cmd/server
          nohup ./redline-server > redline.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8787/healthz && exit 0
            sleep 1
          done
          echo "Redline tidak menjawab di http://localhost:8787/healthz"; cat redline.log; exit 1

      - name: Connect to Tailscale
        if: env.REDLINE_TAILNET_HOST != ''
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.REDLINE_TAILNET_HOST }}

      - name: Check external Redline
        if: env.REDLINE_TAILNET_HOST != ''
        env:
          REDLINE_API_KEY: ${{ secrets.REDLINE_API_KEY }}
        run: |
          curl -sf --retry 10 --retry-delay 2 --retry-all-errors \
            "https://${{ env.REDLINE_TAILNET_HOST }}/readyz"
          # Fail before the suite if the key does not match; /readyz is open on purpose.
          curl -sf -H "Authorization: Bearer $REDLINE_API_KEY" \
            "https://${{ env.REDLINE_TAILNET_HOST }}/api/runs?limit=1" > /dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Redline impact
        # Advisory: map changed files to tests and update one PR comment. The full suite still runs.
        if: github.event_name == 'pull_request' && env.REDLINE_TAILNET_HOST != ''
        continue-on-error: true
        env:
          REDLINE_URL: https://${{ vars.REDLINE_TAILNET_HOST }}
          REDLINE_API_KEY: ${{ secrets.REDLINE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/redline-impact.mts --comment

      - name: Previous Allure history
        # Riwayat tren dari laporan terakhir di GitHub Pages. Run pertama belum punya riwayat.
        run: |
          mkdir -p test-results
          curl -sfL "$PAGES_URL/history.jsonl" -o test-results/allure-history.jsonl \
            || echo "Belum ada riwayat Allure di $PAGES_URL"

      - name: Run Playwright tests
        run: npx playwright test
        env:
          # External mode: send to the Tailscale Serve URL; otherwise the throwaway server on localhost.
          REDLINE_URL: ${{ vars.REDLINE_TAILNET_HOST != '' && format('https://{0}', vars.REDLINE_TAILNET_HOST) || 'http://localhost:8787' }}
          REDLINE_API_KEY: ${{ secrets.REDLINE_API_KEY }}
          # REDLINE_AI=1 meminta analisis; tanpa API key di server, yang dipakai hanya aturan.
          REDLINE_AI: "1"
          # Batasi jumlah insiden yang dianalisis AI per run; budget harian tetap di server.
          REDLINE_AI_MAX: "5"
          # Toolshop's seed admin, the same for everyone (live and Docker): not a secret. Customers are
          # registered by the tests.
          TOOLSHOP_ADMIN_EMAIL: admin@practicesoftwaretesting.com
          TOOLSHOP_ADMIN_PASSWORD: welcome01

      - name: Build Allure report
        if: ${{ !cancelled() }}
        run: |
          npx allure generate
          # Riwayat ikut diterbitkan, supaya run berikutnya bisa melanjutkan trennya.
          cp test-results/allure-history.jsonl test-results/allure-report/history.jsonl

      - name: Toolshop logs (on failure)
        if: failure() && env.TOOLSHOP_TARGET == 'local'
        working-directory: toolshop
        run: docker compose logs --tail=200 laravel-api web mariadb

      - name: Redline logs (on failure)
        if: failure() && env.REDLINE_TAILNET_HOST == ''
        run: tail -100 redline/redline.log || true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: test-results/allure-report/
          retention-days: 30

      - name: Upload report for GitHub Pages
        # Hanya dari main. Laporan diterbitkan juga saat ada test gagal: justru saat itu laporannya dibutuhkan.
        id: pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: test-results/allure-report/

  deploy:
    needs: test
    # Juga saat test gagal, asalkan laporannya sempat dibuat.
    if: ${{ !cancelled() && needs.test.outputs.pages != '' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
